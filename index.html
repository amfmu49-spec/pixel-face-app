<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Face - Face Tracking & MIC Lip Sync</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- MediaPipe Face Detection & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #030607;
      font-family: 'Space Mono', 'Noto Sans JP', monospace;
      color: #00ffcc;
    }

    /* Invisible Webcam Video */
    #webcam-video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -100;
    }

    /* Viewport Frame */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(0, 255, 204, 0.06) 0%, rgba(0, 0, 0, 0.95) 75%);
    }

    /* CRT Scanline */
    .crt-scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.15), transparent);
      opacity: 0.6;
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    /* Floating Breathing Container - Meta AI Original Spacing */
    .face-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12vh;
      animation: breathe 3.2s ease-in-out infinite, crtFlicker 0.15s steps(2) infinite;
      will-change: transform;
      z-index: 2;
      margin-bottom: 14vh;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    @keyframes crtFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.97; }
    }

    /* Eyes Row - Meta AI Original 25vw Gap */
    .eyes-row {
      display: flex;
      gap: 25vw;
      align-items: center;
    }

    /* Eye Element - Meta AI Original Aspect Ratio */
    .eye {
      width: 14.5vw;
      height: 14.5vw;
      max-width: 140px;
      max-height: 140px;
      min-width: 75px;
      min-height: 75px;
      background-color: #00ffcc;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      border-radius: 4px;
      position: relative;
      transition: height 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s ease;
      will-change: transform, height, width;
    }

    .eye.blinking {
      height: 2vw !important;
      min-height: 10px !important;
    }

    /* Eye Highlight Pupil */
    .eye-glint {
      position: absolute;
      top: 18%;
      left: 18%;
      width: 28%;
      height: 28%;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 2px;
      transition: opacity 0.12s ease;
    }

    /* Mouth Element - Supports U-shaped Smile & Dynamic Lip Sync */
    .mouth {
      width: 28vw;
      height: 3vw;
      max-width: 280px;
      max-height: 30px;
      min-width: 140px;
      min-height: 15px;
      background-color: #00ffcc;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      border-radius: 4px;
      transform-origin: center center;
      transition: transform 0.05s linear, border-radius 0.2s ease, width 0.25s ease, height 0.25s ease;
      will-change: transform, border-radius, height;
    }

    /* U-Shaped Smile Mouth Expression */
    .mouth.smile-u {
      height: 7vw !important;
      max-height: 70px !important;
      min-height: 35px !important;
      border-radius: 0 0 100px 100px !important;
    }

    /* Minimal Bottom Control Panel */
    .control-panel {
      position: absolute;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 380px);
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(0, 255, 204, 0.18);
      border-radius: 14px;
      padding: 10px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,255,204,0.08) inset;
    }

    .btn-action {
      background: rgba(0, 255, 204, 0.1);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.22);
      padding: 9px 16px;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
      outline: none;
      letter-spacing: 0.05em;
    }

    .btn-action.active {
      background: #00ffcc;
      color: #000;
      border-color: #00ffcc;
      box-shadow: 0 0 14px rgba(0, 255, 204, 0.65);
    }

    .btn-dot {
      font-size: 12px;
    }

    .vol-track {
      flex: 1;
      height: 5px;
      background: rgba(0, 255, 204, 0.14);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .vol-fill {
      height: 100%;
      width: 0%;
      background: #00ffcc;
      box-shadow: 0 0 8px #00ffcc;
      border-radius: 10px;
      transition: width 0.04s linear;
    }
  </style>
</head>
<body>

  <!-- HIDDEN WEBCAM VIDEO FOR MEDIAPIPE FACE TRACKING -->
  <video id="webcam-video" playsinline muted></video>

  <div class="app-viewport" id="viewport">
    <div class="crt-scanline"></div>

    <!-- FACE -->
    <div class="face-container" id="face-container">
      <div class="eyes-row">
        <div class="eye" id="eye-left">
          <div class="eye-glint" id="glint-left"></div>
        </div>
        <div class="eye" id="eye-right">
          <div class="eye-glint" id="glint-right"></div>
        </div>
      </div>

      <div class="mouth" id="mouth"></div>
    </div>

    <!-- MINIMAL BOTTOM PANEL (MIC & INCAME) -->
    <div class="control-panel" id="control-panel">
      <!-- MIC BUTTON -->
      <button class="btn-action" id="btn-mic">
        <span class="btn-dot" id="btn-mic-dot">●</span>
        <span>MIC</span>
      </button>

      <!-- INCAME FACE TRACKING BUTTON -->
      <button class="btn-action" id="btn-incame">
        <span class="btn-dot" id="btn-incame-dot">●</span>
        <span>INCAME</span>
      </button>

      <!-- HIGH-ACCURACY AUDIO VOL BAR -->
      <div class="vol-track">
        <div class="vol-fill" id="vol-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Audio State
    let isMicActive = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let volume = 0;

    // Face Tracking State
    let isIncameActive = false;
    let cameraInstance = null;
    let faceDetectionInstance = null;

    // Expressions: neutral, smile (U-shaped), surprised, wink, sleep
    const expressions = ['neutral', 'smile', 'surprised', 'wink', 'sleep'];
    let currentExpIndex = 0;

    // Eye Gaze Target Position
    let targetGazeX = 0;
    let targetGazeY = 0;
    let currentGazeX = 0;
    let currentGazeY = 0;

    // Elements
    const viewport = document.getElementById('viewport');
    const controlPanel = document.getElementById('control-panel');
    const webcamVideo = document.getElementById('webcam-video');
    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const mouth = document.getElementById('mouth');
    
    const btnMic = document.getElementById('btn-mic');
    const btnMicDot = document.getElementById('btn-mic-dot');
    
    const btnIncame = document.getElementById('btn-incame');
    const btnIncameDot = document.getElementById('btn-incame-dot');
    
    const volFill = document.getElementById('vol-fill');

    // Prevent panel clicks from triggering expression tap
    controlPanel.addEventListener('click', (e) => e.stopPropagation());

    // Expression Tap Switcher (Tap face/screen)
    viewport.addEventListener('click', () => {
      currentExpIndex = (currentExpIndex + 1) % expressions.length;
      applyExpression(expressions[currentExpIndex]);
    });

    function applyExpression(exp) {
      mouth.classList.remove('smile-u');

      switch (exp) {
        case 'smile':
          mouth.classList.add('smile-u');
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.75) scaleX(1.05)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.75) scaleX(1.05)`;
          break;
        case 'surprised':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.2)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.2)`;
          break;
        case 'wink':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.05)`;
          break;
        case 'sleep':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          break;
        case 'neutral':
        default:
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw)`;
          break;
      }
    }

    // ------------------------------------------------------------
    // MEDIAPIPE IN-CAMERA FACE RECOGNITION & GAZE TRACKING
    // ------------------------------------------------------------
    btnIncame.addEventListener('click', async () => {
      if (isIncameActive) {
        stopIncameTracking();
      } else {
        await startIncameTracking();
      }
    });

    async function startIncameTracking() {
      try {
        if (!faceDetectionInstance) {
          faceDetectionInstance = new FaceDetection({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`
          });

          faceDetectionInstance.setOptions({
            model: 'short',
            minDetectionConfidence: 0.5
          });

          faceDetectionInstance.onResults((results) => {
            if (results.detections && results.detections.length > 0) {
              const box = results.detections[0].locationData.relativeBoundingBox;
              
              // Center of detected face in camera frame
              const faceX = box.xmin + box.width / 2;
              const faceY = box.ymin + box.height / 2;

              // Front camera mirror calculation: normX from -0.5 to +0.5
              const normX = (1.0 - faceX) - 0.5;
              const normY = faceY - 0.5;

              // Map to eye gaze offsets
              targetGazeX = normX * 8; // -4vw to +4vw
              targetGazeY = normY * 6; // -3vh to +3vh
            }
          });
        }

        if (!cameraInstance) {
          cameraInstance = new Camera(webcamVideo, {
            onFrame: async () => {
              if (isIncameActive && faceDetectionInstance) {
                await faceDetectionInstance.send({ image: webcamVideo });
              }
            },
            width: 640,
            height: 480,
            facingMode: 'user'
          });
        }

        await cameraInstance.start();
        isIncameActive = true;
        btnIncame.classList.add('active');
        btnIncameDot.textContent = '■';
      } catch (err) {
        alert('インカメのアクセスを許可してください');
        console.error(err);
      }
    }

    function stopIncameTracking() {
      isIncameActive = false;
      if (cameraInstance) {
        cameraInstance.stop();
      }
      targetGazeX = 0;
      targetGazeY = 0;
      btnIncame.classList.remove('active');
      btnIncameDot.textContent = '●';
    }

    // Smooth Eye Gaze Animation Loop
    function renderGazeLoop() {
      currentGazeX += (targetGazeX - currentGazeX) * 0.18;
      currentGazeY += (targetGazeY - currentGazeY) * 0.18;

      applyExpression(expressions[currentExpIndex]);

      requestAnimationFrame(renderGazeLoop);
    }
    renderGazeLoop();

    // Natural Blinking Loop
    function scheduleBlink() {
      const delay = Math.random() * 3500 + 2000;
      setTimeout(() => {
        if (expressions[currentExpIndex] !== 'sleep' && expressions[currentExpIndex] !== 'wink') {
          eyeLeft.classList.add('blinking');
          eyeRight.classList.add('blinking');
          setTimeout(() => {
            eyeLeft.classList.remove('blinking');
            eyeRight.classList.remove('blinking');
            scheduleBlink();
          }, 120);
        } else {
          scheduleBlink();
        }
      }, delay);
    }
    scheduleBlink();

    // ------------------------------------------------------------
    // HIGH-ACCURACY VOICE LIP SYNC (VOCAL SPECTRUM RMS)
    // ------------------------------------------------------------
    btnMic.addEventListener('click', async () => {
      if (isMicActive) {
        stopMicrophone();
      } else {
        await startMicrophone();
      }
    });

    async function startMicrophone() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.4;
        source.connect(analyser);

        isMicActive = true;
        btnMic.classList.add('active');
        btnMicDot.textContent = '■';

        renderAudioLoop();
      } catch (err) {
        alert('マイクのアクセスを許可してください');
        console.error(err);
      }
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      isMicActive = false;
      btnMic.classList.remove('active');
      btnMicDot.textContent = '●';
      volFill.style.width = '0%';
      mouth.style.transform = 'scaleY(1)';
    }

    function renderAudioLoop() {
      if (!isMicActive || !analyser) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      const startBin = 3;
      const endBin = Math.min(dataArray.length, 60);
      let sum = 0;
      let count = 0;

      for (let i = startBin; i < endBin; i++) {
        sum += dataArray[i] * dataArray[i];
        count++;
      }

      const rms = Math.sqrt(sum / count);
      const normalizedVol = Math.min(1.0, (rms / 75));
      const targetVol = Math.pow(normalizedVol, 0.7);

      if (targetVol > volume) {
        volume += (targetVol - volume) * 0.45;
      } else {
        volume += (targetVol - volume) * 0.22;
      }

      volFill.style.width = `${Math.min(100, Math.round(volume * 100))}%`;

      if (volume > 0.05) {
        const mouthScaleY = 1 + volume * 5.2;
        const mouthScaleX = 1 + volume * 0.15;
        mouth.style.transform = `scaleY(${mouthScaleY.toFixed(2)}) scaleX(${mouthScaleX.toFixed(2)})`;
      } else {
        mouth.style.transform = 'scaleY(1) scaleX(1)';
      }

      requestAnimationFrame(renderAudioLoop);
    }

    // Global Window API
    window.setPixelMouth = function(val) {
      const v = Math.max(0, Math.min(1, val));
      if (v > 0.05) {
        mouth.style.transform = `scaleY(${(1 + v * 5.2).toFixed(2)}) scaleX(${(1 + v * 0.15).toFixed(2)})`;
      } else {
        mouth.style.transform = 'scaleY(1) scaleX(1)';
      }
    };
  </script>
</body>
</html>
