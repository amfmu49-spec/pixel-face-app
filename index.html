<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Face - Realtime Lip Sync & Gaze Tracking</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #030607;
      font-family: 'Space Mono', 'Noto Sans JP', monospace;
      color: #00ffcc;
    }

    /* Viewport Frame */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(0, 255, 204, 0.06) 0%, rgba(0, 0, 0, 0.95) 75%);
      cursor: crosshair;
    }

    /* CRT Scanline */
    .crt-scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.15), transparent);
      opacity: 0.6;
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    /* Floating Breathing Container - Original Gaps */
    .face-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12vh;
      animation: breathe 3.2s ease-in-out infinite, crtFlicker 0.15s steps(2) infinite;
      will-change: transform;
      z-index: 2;
      margin-bottom: 14vh;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    @keyframes crtFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.97; }
    }

    /* Eyes Row - Original Meta AI 25vw Gap */
    .eyes-row {
      display: flex;
      gap: 25vw;
      align-items: center;
    }

    /* Eye Element - Original Meta AI Aspect Ratio & Styling */
    .eye {
      width: 14.5vw;
      height: 14.5vw;
      max-width: 140px;
      max-height: 140px;
      min-width: 75px;
      min-height: 75px;
      background-color: #00ffcc;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      border-radius: 4px;
      position: relative;
      transition: height 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s ease;
      will-change: transform, height, width;
    }

    .eye.blinking {
      height: 2vw !important;
      min-height: 10px !important;
    }

    /* Eye Highlight Pupil */
    .eye-glint {
      position: absolute;
      top: 18%;
      left: 18%;
      width: 28%;
      height: 28%;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 2px;
      transition: opacity 0.12s ease;
    }

    /* Mouth Element - Original Meta AI Styling */
    .mouth {
      width: 28vw;
      height: 3vw;
      max-width: 280px;
      max-height: 30px;
      min-width: 140px;
      min-height: 15px;
      background-color: #00ffcc;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      border-radius: 4px;
      transform-origin: center center;
      transition: transform 0.06s linear, width 0.3s ease, height 0.3s ease;
      will-change: transform;
    }

    /* Touch Pointer Indicator */
    .touch-cursor {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid #00ffcc;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 0 10px #00ffcc;
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
      opacity: 0;
    }
    .touch-cursor.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.8;
    }

    /* Minimal Bottom Control Panel */
    .control-panel {
      position: absolute;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 420px);
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(0, 255, 204, 0.18);
      border-radius: 14px;
      padding: 10px 16px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,255,204,0.08) inset;
    }

    .btn-mic {
      background: rgba(0, 255, 204, 0.1);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.22);
      padding: 9px 16px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-mic.active {
      background: #00ffcc;
      color: #000;
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
    }

    .btn-dot {
      font-size: 13px;
    }

    .vol-track {
      flex: 1;
      height: 5px;
      background: rgba(0, 255, 204, 0.14);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .vol-fill {
      height: 100%;
      width: 0%;
      background: #00ffcc;
      box-shadow: 0 0 8px #00ffcc;
      border-radius: 10px;
      transition: width 0.06s linear;
    }
  </style>
</head>
<body>

  <div class="app-viewport" id="viewport">
    <div class="crt-scanline"></div>
    <div class="touch-cursor" id="touch-cursor"></div>

    <!-- FACE -->
    <div class="face-container" id="face-container">
      <div class="eyes-row">
        <div class="eye" id="eye-left">
          <div class="eye-glint" id="glint-left"></div>
        </div>
        <div class="eye" id="eye-right">
          <div class="eye-glint" id="glint-right"></div>
        </div>
      </div>

      <div class="mouth" id="mouth"></div>
    </div>

    <!-- MINIMAL BOTTOM PANEL -->
    <div class="control-panel" id="control-panel">
      <button class="btn-mic" id="btn-mic">
        <span class="btn-dot" id="btn-dot">●</span>
        <span id="btn-mic-text">マイクで口パク</span>
      </button>

      <div class="vol-track">
        <div class="vol-fill" id="vol-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Audio State
    let isMicActive = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let volume = 0;
    let isSpeaking = false;

    // Expressions: neutral, smile, surprised, wink, sleep
    const expressions = ['neutral', 'smile', 'surprised', 'wink', 'sleep'];
    let currentExpIndex = 0;

    // Eye Gaze Tracking (Following Finger / Touch / Mouse)
    let targetGazeX = 0; // -3vw to +3vw
    let targetGazeY = 0; // -2vw to +2vw
    let currentGazeX = 0;
    let currentGazeY = 0;
    let isTouching = false;

    // Elements
    const viewport = document.getElementById('viewport');
    const controlPanel = document.getElementById('control-panel');
    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const mouth = document.getElementById('mouth');
    const btnMic = document.getElementById('btn-mic');
    const btnDot = document.getElementById('btn-dot');
    const btnMicText = document.getElementById('btn-mic-text');
    const volFill = document.getElementById('vol-fill');
    const touchCursor = document.getElementById('touch-cursor');

    // Prevent panel clicks from triggering expression tap
    controlPanel.addEventListener('click', (e) => e.stopPropagation());

    // Expression Tap Switcher (Tap face/screen)
    viewport.addEventListener('click', () => {
      if (isTouching) return;
      currentExpIndex = (currentExpIndex + 1) % expressions.length;
      applyExpression(expressions[currentExpIndex]);
    });

    function applyExpression(exp) {
      switch (exp) {
        case 'smile':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.7) scaleX(1.05)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.7) scaleX(1.05)`;
          break;
        case 'surprised':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.2)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.2)`;
          break;
        case 'wink':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.05)`;
          break;
        case 'sleep':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          break;
        case 'neutral':
        default:
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw)`;
          break;
      }
    }

    // ------------------------------------------------------------
    // FINGER & POINTER EYE GAZE TRACKING
    // ------------------------------------------------------------
    function updatePointerGaze(clientX, clientY) {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      // Range in viewport width units (vw/vh)
      const normX = (clientX - centerX) / window.innerWidth; // -0.5 to +0.5
      const normY = (clientY - centerY) / window.innerHeight; // -0.5 to +0.5

      targetGazeX = normX * 8; // Max 4vw left/right shift
      targetGazeY = normY * 6; // Max 3vh top/bottom shift

      // Show touch cursor
      touchCursor.style.left = `${clientX}px`;
      touchCursor.style.top = `${clientY}px`;
      touchCursor.classList.add('active');
    }

    window.addEventListener('pointermove', (e) => {
      updatePointerGaze(e.clientX, e.clientY);
    });

    window.addEventListener('pointerdown', (e) => {
      isTouching = true;
      updatePointerGaze(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => {
      isTouching = false;
      touchCursor.classList.remove('active');
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updatePointerGaze(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        isTouching = true;
        updatePointerGaze(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isTouching = false;
      touchCursor.classList.remove('active');
    });

    // Smooth Pupil Eye Gaze Animation Loop
    function renderGazeLoop() {
      currentGazeX += (targetGazeX - currentGazeX) * 0.2;
      currentGazeY += (targetGazeY - currentGazeY) * 0.2;

      applyExpression(expressions[currentExpIndex]);

      requestAnimationFrame(renderGazeLoop);
    }
    renderGazeLoop();

    // Natural Blinking Loop
    function scheduleBlink() {
      const delay = Math.random() * 3500 + 2000;
      setTimeout(() => {
        if (expressions[currentExpIndex] !== 'sleep' && expressions[currentExpIndex] !== 'wink') {
          eyeLeft.classList.add('blinking');
          eyeRight.classList.add('blinking');
          setTimeout(() => {
            eyeLeft.classList.remove('blinking');
            eyeRight.classList.remove('blinking');
            scheduleBlink();
          }, 120);
        } else {
          scheduleBlink();
        }
      }, delay);
    }
    scheduleBlink();

    // ------------------------------------------------------------
    // REALTIME MICROPHONE LIP SYNC (WEB AUDIO API)
    // ------------------------------------------------------------
    btnMic.addEventListener('click', async () => {
      if (isMicActive) {
        stopMicrophone();
      } else {
        await startMicrophone();
      }
    });

    async function startMicrophone() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        isMicActive = true;
        btnMic.classList.add('active');
        btnDot.textContent = '■';
        btnMicText.textContent = 'マイク停止';

        renderAudioLoop();
      } catch (err) {
        alert('マイクのアクセスを許可してください');
        console.error(err);
      }
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      isMicActive = false;
      isSpeaking = false;
      btnMic.classList.remove('active');
      btnDot.textContent = '●';
      btnMicText.textContent = 'マイクで口パク';
      volFill.style.width = '0%';
      mouth.style.transform = 'scaleY(1)';
    }

    function renderAudioLoop() {
      if (!isMicActive || !analyser) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i] * dataArray[i];
      }
      const rms = Math.sqrt(sum / dataArray.length);
      const rawVol = Math.min(1.0, (rms / 80) * 2.2);

      volume += (rawVol - volume) * 0.35;
      volFill.style.width = `${Math.min(100, Math.round(volume * 100))}%`;

      if (volume > 0.08) {
        isSpeaking = true;
        const mouthScaleY = 1 + volume * 4.5;
        mouth.style.transform = `scaleY(${mouthScaleY.toFixed(2)})`;
      } else {
        isSpeaking = false;
        mouth.style.transform = 'scaleY(1)';
      }

      requestAnimationFrame(renderAudioLoop);
    }

    // Global Window API
    window.setPixelMouth = function(val) {
      const v = Math.max(0, Math.min(1, val));
      if (v > 0.05) {
        mouth.style.transform = `scaleY(${(1 + v * 4.5).toFixed(2)})`;
      } else {
        mouth.style.transform = 'scaleY(1)';
      }
    };
  </script>
</body>
</html>
