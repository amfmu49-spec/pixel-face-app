<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Face - MediaPipe Finger Tracking & Lip Sync</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- MediaPipe Hands & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #030607;
      font-family: 'Space Mono', 'Noto Sans JP', monospace;
      color: #00ffcc;
    }

    /* Hidden Camera Video Element */
    #webcam-video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -100;
    }

    /* Viewport Frame */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(0, 255, 204, 0.06) 0%, rgba(0, 0, 0, 0.95) 75%);
    }

    /* CRT Scanline */
    .crt-scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.15), transparent);
      opacity: 0.6;
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    /* Floating Breathing Container - Original Meta AI Gaps */
    .face-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12vh;
      animation: breathe 3.2s ease-in-out infinite, crtFlicker 0.15s steps(2) infinite;
      will-change: transform;
      z-index: 2;
      margin-bottom: 14vh;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    @keyframes crtFlicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.97; }
    }

    /* Eyes Row - Original Meta AI 25vw Gap */
    .eyes-row {
      display: flex;
      gap: 25vw;
      align-items: center;
    }

    /* Eye Element - Original Meta AI Aspect Ratio & Styling */
    .eye {
      width: 14.5vw;
      height: 14.5vw;
      max-width: 140px;
      max-height: 140px;
      min-width: 75px;
      min-height: 75px;
      background-color: #00ffcc;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      border-radius: 4px;
      position: relative;
      transition: height 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.2s ease;
      will-change: transform, height, width;
    }

    .eye.blinking {
      height: 2vw !important;
      min-height: 10px !important;
    }

    /* Eye Highlight Pupil */
    .eye-glint {
      position: absolute;
      top: 18%;
      left: 18%;
      width: 28%;
      height: 28%;
      background: rgba(255, 255, 255, 0.55);
      border-radius: 2px;
      transition: opacity 0.12s ease;
    }

    /* Mouth Element - Original Meta AI Styling */
    .mouth {
      width: 28vw;
      height: 3vw;
      max-width: 280px;
      max-height: 30px;
      min-width: 140px;
      min-height: 15px;
      background-color: #00ffcc;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      border-radius: 4px;
      transform-origin: center center;
      transition: transform 0.06s linear, width 0.3s ease, height 0.3s ease;
      will-change: transform;
    }

    /* Minimal Bottom Control Panel */
    .control-panel {
      position: absolute;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(94vw, 440px);
      background: rgba(0, 0, 0, 0.88);
      border: 1px solid rgba(0, 255, 204, 0.18);
      border-radius: 14px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,255,204,0.08) inset;
    }

    .btn-action {
      background: rgba(0, 255, 204, 0.1);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.22);
      padding: 9px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s ease;
      outline: none;
    }

    .btn-action.active {
      background: #00ffcc;
      color: #000;
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.6);
    }

    .btn-dot {
      font-size: 12px;
    }

    .vol-track {
      flex: 1;
      height: 5px;
      background: rgba(0, 255, 204, 0.14);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      min-width: 40px;
    }

    .vol-fill {
      height: 100%;
      width: 0%;
      background: #00ffcc;
      box-shadow: 0 0 8px #00ffcc;
      border-radius: 10px;
      transition: width 0.06s linear;
    }
  </style>
</head>
<body>

  <!-- HIDDEN WEBCAM VIDEO FOR MEDIAPIPE HAND TRACKING -->
  <video id="webcam-video" playsinline muted></video>

  <div class="app-viewport" id="viewport">
    <div class="crt-scanline"></div>

    <!-- FACE -->
    <div class="face-container" id="face-container">
      <div class="eyes-row">
        <div class="eye" id="eye-left">
          <div class="eye-glint" id="glint-left"></div>
        </div>
        <div class="eye" id="eye-right">
          <div class="eye-glint" id="glint-right"></div>
        </div>
      </div>

      <div class="mouth" id="mouth"></div>
    </div>

    <!-- MINIMAL BOTTOM PANEL -->
    <div class="control-panel" id="control-panel">
      <!-- MIC BUTTON -->
      <button class="btn-action" id="btn-mic">
        <span class="btn-dot" id="btn-mic-dot">●</span>
        <span id="btn-mic-text">マイク口パク</span>
      </button>

      <!-- FINGER TRACKING BUTTON (IN-CAMERA HAND DETECTION) -->
      <button class="btn-action" id="btn-finger">
        <span class="btn-dot" id="btn-finger-dot">●</span>
        <span id="btn-finger-text">指追従(インカメ)</span>
      </button>

      <!-- VOL BAR -->
      <div class="vol-track">
        <div class="vol-fill" id="vol-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Audio State
    let isMicActive = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let volume = 0;

    // Finger Hand Tracking State
    let isFingerTrackingActive = false;
    let cameraInstance = null;
    let handsInstance = null;

    // Expressions: neutral, smile, surprised, wink, sleep
    const expressions = ['neutral', 'smile', 'surprised', 'wink', 'sleep'];
    let currentExpIndex = 0;

    // Eye Gaze Target Position
    let targetGazeX = 0; // -4vw to +4vw
    let targetGazeY = 0; // -3vh to +3vh
    let currentGazeX = 0;
    let currentGazeY = 0;

    // Elements
    const viewport = document.getElementById('viewport');
    const controlPanel = document.getElementById('control-panel');
    const webcamVideo = document.getElementById('webcam-video');
    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const mouth = document.getElementById('mouth');
    
    const btnMic = document.getElementById('btn-mic');
    const btnMicDot = document.getElementById('btn-mic-dot');
    const btnMicText = document.getElementById('btn-mic-text');
    
    const btnFinger = document.getElementById('btn-finger');
    const btnFingerDot = document.getElementById('btn-finger-dot');
    const btnFingerText = document.getElementById('btn-finger-text');
    
    const volFill = document.getElementById('vol-fill');

    // Prevent panel clicks from triggering expression tap
    controlPanel.addEventListener('click', (e) => e.stopPropagation());

    // Expression Tap Switcher (Tap face/screen)
    viewport.addEventListener('click', () => {
      currentExpIndex = (currentExpIndex + 1) % expressions.length;
      applyExpression(expressions[currentExpIndex]);
    });

    function applyExpression(exp) {
      switch (exp) {
        case 'smile':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.7) scaleX(1.05)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.7) scaleX(1.05)`;
          break;
        case 'surprised':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.2)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.2)`;
          break;
        case 'wink':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scale(1.05)`;
          break;
        case 'sleep':
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw) scaleY(0.12)`;
          break;
        case 'neutral':
        default:
          eyeLeft.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw)`;
          eyeRight.style.transform = `translate(${currentGazeX}vw, ${currentGazeY}vw)`;
          break;
      }
    }

    // ------------------------------------------------------------
    // MEDIAPIPE IN-CAMERA HAND FINGER RECOGNITION (INVISIBLE CAMERA)
    // ------------------------------------------------------------
    btnFinger.addEventListener('click', async () => {
      if (isFingerTrackingActive) {
        stopFingerTracking();
      } else {
        await startFingerTracking();
      }
    });

    async function startFingerTracking() {
      try {
        btnFingerText.textContent = '初期化中...';

        if (!handsInstance) {
          handsInstance = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
          });

          handsInstance.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });

          handsInstance.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
              const landmarks = results.multiHandLandmarks[0];
              // Landmark 8: Index Finger Tip
              const indexTip = landmarks[8];
              
              // Front camera mirror calculation
              const normX = (1.0 - indexTip.x) - 0.5; // -0.5 to +0.5
              const normY = indexTip.y - 0.5;        // -0.5 to +0.5

              // Map to eye gaze offsets
              targetGazeX = normX * 8; // -4vw to +4vw
              targetGazeY = normY * 6; // -3vh to +3vh
            }
          });
        }

        if (!cameraInstance) {
          cameraInstance = new Camera(webcamVideo, {
            onFrame: async () => {
              if (isFingerTrackingActive && handsInstance) {
                await handsInstance.send({ image: webcamVideo });
              }
            },
            width: 640,
            height: 480,
            facingMode: 'user'
          });
        }

        await cameraInstance.start();
        isFingerTrackingActive = true;
        btnFinger.classList.add('active');
        btnFingerDot.textContent = '■';
        btnFingerText.textContent = '指追従 停止';
      } catch (err) {
        alert('インカメのアクセスを許可してください');
        btnFingerText.textContent = '指追従(インカメ)';
        console.error(err);
      }
    }

    function stopFingerTracking() {
      isFingerTrackingActive = false;
      if (cameraInstance) {
        cameraInstance.stop();
      }
      targetGazeX = 0;
      targetGazeY = 0;
      btnFinger.classList.remove('active');
      btnFingerDot.textContent = '●';
      btnFingerText.textContent = '指追従(インカメ)';
    }

    // Smooth Pupil Eye Gaze Animation Loop
    function renderGazeLoop() {
      currentGazeX += (targetGazeX - currentGazeX) * 0.18;
      currentGazeY += (targetGazeY - currentGazeY) * 0.18;

      applyExpression(expressions[currentExpIndex]);

      requestAnimationFrame(renderGazeLoop);
    }
    renderGazeLoop();

    // Natural Blinking Loop
    function scheduleBlink() {
      const delay = Math.random() * 3500 + 2000;
      setTimeout(() => {
        if (expressions[currentExpIndex] !== 'sleep' && expressions[currentExpIndex] !== 'wink') {
          eyeLeft.classList.add('blinking');
          eyeRight.classList.add('blinking');
          setTimeout(() => {
            eyeLeft.classList.remove('blinking');
            eyeRight.classList.remove('blinking');
            scheduleBlink();
          }, 120);
        } else {
          scheduleBlink();
        }
      }, delay);
    }
    scheduleBlink();

    // ------------------------------------------------------------
    // REALTIME MICROPHONE LIP SYNC (WEB AUDIO API)
    // ------------------------------------------------------------
    btnMic.addEventListener('click', async () => {
      if (isMicActive) {
        stopMicrophone();
      } else {
        await startMicrophone();
      }
    });

    async function startMicrophone() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        isMicActive = true;
        btnMic.classList.add('active');
        btnMicDot.textContent = '■';
        btnMicText.textContent = 'マイク停止';

        renderAudioLoop();
      } catch (err) {
        alert('マイクのアクセスを許可してください');
        console.error(err);
      }
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      isMicActive = false;
      btnMic.classList.remove('active');
      btnMicDot.textContent = '●';
      btnMicText.textContent = 'マイク口パク';
      volFill.style.width = '0%';
      mouth.style.transform = 'scaleY(1)';
    }

    function renderAudioLoop() {
      if (!isMicActive || !analyser) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i] * dataArray[i];
      }
      const rms = Math.sqrt(sum / dataArray.length);
      const rawVol = Math.min(1.0, (rms / 80) * 2.2);

      volume += (rawVol - volume) * 0.35;
      volFill.style.width = `${Math.min(100, Math.round(volume * 100))}%`;

      if (volume > 0.08) {
        const mouthScaleY = 1 + volume * 4.5;
        mouth.style.transform = `scaleY(${mouthScaleY.toFixed(2)})`;
      } else {
        mouth.style.transform = 'scaleY(1)';
      }

      requestAnimationFrame(renderAudioLoop);
    }
  </script>
</body>
</html>
