<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Face - Realtime Lip Sync & Eye Tracking</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; /* Smooth touch tracking */
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #030607;
      font-family: 'Space Mono', 'Noto Sans JP', monospace;
      color: #00ffcc;
    }

    /* Fullscreen Screen Container */
    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(0, 255, 204, 0.05) 0%, rgba(0, 0, 0, 0.95) 75%);
      cursor: crosshair;
    }

    /* Video Background for Front Camera */
    .camera-feed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      transform: scaleX(-1); /* Mirror view for front camera */
      pointer-events: none;
      z-index: 1;
      display: none;
      filter: grayscale(0.5) contrast(1.2);
    }

    /* CRT Scanline Effect */
    .crt-scanline {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.15), transparent);
      opacity: 0.6;
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    /* Ambient Breathing Container */
    .face-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: min(8vh, 60px);
      animation: breathe 3.2s ease-in-out infinite;
      will-change: transform;
      z-index: 2;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* Eyes Row */
    .eyes-row {
      display: flex;
      gap: min(22vw, 150px);
      align-items: center;
    }

    /* Eye Box */
    .eye {
      width: min(28vw, 130px);
      height: min(28vw, 130px);
      background-color: #00ffcc;
      border-radius: 6px;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      position: relative;
      overflow: hidden;
      transition: transform 0.08s ease, height 0.15s ease, opacity 0.15s ease;
      will-change: transform, height, width;
    }

    /* Pupil Block inside Eye (Follows Finger) */
    .eye-pupil {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      background: #030607;
      border-radius: 4px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 10%;
      transition: transform 0.05s linear;
      will-change: transform;
    }

    /* Eye Glint Highlight */
    .eye-glint {
      width: 45%;
      height: 45%;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 2px;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    /* Mouth Element */
    .mouth {
      width: min(46vw, 240px);
      height: min(4vw, 18px);
      background-color: #00ffcc;
      border-radius: 6px;
      box-shadow: 0 0 24px rgba(0, 255, 204, 0.6), 0 0 50px rgba(0, 255, 204, 0.25);
      transform-origin: center center;
      transition: transform 0.06s linear, height 0.08s ease;
      will-change: transform, height;
    }

    /* Expression Modifiers */
    .eye.blinking {
      transform: scaleY(0.08) !important;
    }

    .expression-badge {
      position: absolute;
      top: 2.5vh;
      right: 4vw;
      font-size: 11px;
      color: rgba(0, 255, 204, 0.4);
      letter-spacing: 0.12em;
      pointer-events: none;
      z-index: 4;
    }

    /* Touch Finger Visualizer */
    .touch-cursor {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 2px solid #00ffcc;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 0 12px #00ffcc;
      transition: transform 0.15s ease-out, opacity 0.15s ease-out;
      opacity: 0;
    }
    .touch-cursor.active {
      transform: translate(-50%, -50%) scale(1);
      opacity: 0.8;
    }

    /* Minimal Bottom Control Panel */
    .control-panel {
      position: absolute;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 420px);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(0, 255, 204, 0.25);
      border-radius: 30px;
      padding: 8px 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 255, 204, 0.1) inset;
    }

    .btn-action {
      background: rgba(0, 255, 204, 0.1);
      color: #00ffcc;
      border: 1px solid rgba(0, 255, 204, 0.3);
      padding: 8px 14px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.2s ease;
      outline: none;
      touch-action: manipulation;
    }

    .btn-action.active {
      background: #00ffcc;
      color: #000;
      border-color: #00ffcc;
      box-shadow: 0 0 14px rgba(0, 255, 204, 0.7);
    }

    .btn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .vol-track {
      flex: 1;
      height: 4px;
      background: rgba(0, 255, 204, 0.15);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      min-width: 50px;
    }

    .vol-fill {
      height: 100%;
      width: 0%;
      background: #00ffcc;
      box-shadow: 0 0 8px #00ffcc;
      border-radius: 10px;
      transition: width 0.05s linear;
    }
  </style>
</head>
<body>

  <!-- FRONT CAMERA VIDEO STREAM (HIDDEN / OVERLAY) -->
  <video id="camera-video" class="camera-feed" autoplay playsinline muted></video>

  <div class="app-viewport" id="viewport">
    <div class="crt-scanline"></div>

    <!-- TOUCH CURSOR -->
    <div class="touch-cursor" id="touch-cursor"></div>

    <div class="expression-badge" id="exp-badge">NEUTRAL</div>

    <!-- FACE -->
    <div class="face-container" id="face-container">
      <!-- EYES -->
      <div class="eyes-row">
        <div class="eye" id="eye-left">
          <div class="eye-pupil" id="pupil-left">
            <div class="eye-glint"></div>
          </div>
        </div>
        <div class="eye" id="eye-right">
          <div class="eye-pupil" id="pupil-right">
            <div class="eye-glint"></div>
          </div>
        </div>
      </div>

      <!-- MOUTH -->
      <div class="mouth" id="mouth"></div>
    </div>

    <!-- MINIMAL CONTROLS -->
    <div class="control-panel" id="control-panel">
      <!-- MIC BUTTON -->
      <button class="btn-action" id="btn-mic">
        <span class="btn-dot"></span>
        <span id="btn-mic-text">マイク</span>
      </button>

      <!-- FRONT CAMERA BUTTON -->
      <button class="btn-action" id="btn-cam">
        <span class="btn-dot"></span>
        <span id="btn-cam-text">インカメ</span>
      </button>
      
      <!-- VOL BAR -->
      <div class="vol-track">
        <div class="vol-fill" id="vol-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Audio State
    let isMicActive = false;
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let volume = 0;

    // Camera State
    let isCamActive = false;
    let camStream = null;
    
    // Expressions: neutral, smile, surprised, wink, sleep
    const expressions = ['NEUTRAL', 'SMILE', 'SURPRISED', 'WINK', 'SLEEP'];
    let currentExpIndex = 0;

    // Eye Gaze Tracking State
    let targetX = 0; // -1 to +1
    let targetY = 0; // -1 to +1
    let currentPupilX = 0;
    let currentPupilY = 0;
    let isTouching = false;

    // Elements
    const viewport = document.getElementById('viewport');
    const controlPanel = document.getElementById('control-panel');
    const cameraVideo = document.getElementById('camera-video');
    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const pupilLeft = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');
    const mouth = document.getElementById('mouth');
    const expBadge = document.getElementById('exp-badge');
    const btnMic = document.getElementById('btn-mic');
    const btnMicText = document.getElementById('btn-mic-text');
    const btnCam = document.getElementById('btn-cam');
    const btnCamText = document.getElementById('btn-cam-text');
    const volFill = document.getElementById('vol-fill');
    const touchCursor = document.getElementById('touch-cursor');

    // Prevent panel clicks from triggering expression tap
    controlPanel.addEventListener('click', (e) => e.stopPropagation());

    // Expression Tap Switcher (when clicking outside controls)
    viewport.addEventListener('click', (e) => {
      // Don't switch if dragging finger
      if (isTouching) return;
      currentExpIndex = (currentExpIndex + 1) % expressions.length;
      const exp = expressions[currentExpIndex];
      expBadge.textContent = exp;
      applyExpression(exp);
    });

    function applyExpression(exp) {
      eyeLeft.style.transform = '';
      eyeRight.style.transform = '';
      
      switch (exp) {
        case 'SMILE':
          eyeLeft.style.transform = 'scaleY(0.7) rotate(-5deg)';
          eyeRight.style.transform = 'scaleY(0.7) rotate(5deg)';
          break;
        case 'SURPRISED':
          eyeLeft.style.transform = 'scale(1.25)';
          eyeRight.style.transform = 'scale(1.25)';
          break;
        case 'WINK':
          eyeLeft.style.transform = 'scaleY(0.15)';
          eyeRight.style.transform = 'scale(1.05)';
          break;
        case 'SLEEP':
          eyeLeft.style.transform = 'scaleY(0.15)';
          eyeRight.style.transform = 'scaleY(0.15)';
          break;
        case 'NEUTRAL':
        default:
          break;
      }
    }

    // ------------------------------------------------------------
    // EYE GAZE TRACKING (FINGER / TOUCH / POINTER TRACKING)
    // ------------------------------------------------------------
    function updateGazePosition(clientX, clientY) {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;

      // Range: -1 (left/top) to +1 (right/bottom)
      targetX = Math.max(-1, Math.min(1, (clientX - centerX) / (window.innerWidth * 0.4)));
      targetY = Math.max(-1, Math.min(1, (clientY - centerY) / (window.innerHeight * 0.4)));

      // Position touch cursor
      touchCursor.style.left = `${clientX}px`;
      touchCursor.style.top = `${clientY}px`;
      touchCursor.classList.add('active');
    }

    // Pointer & Touch Events
    window.addEventListener('pointermove', (e) => {
      updateGazePosition(e.clientX, e.clientY);
    });

    window.addEventListener('pointerdown', (e) => {
      isTouching = true;
      updateGazePosition(e.clientX, e.clientY);
    });

    window.addEventListener('pointerup', () => {
      isTouching = false;
      touchCursor.classList.remove('active');
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updateGazePosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        isTouching = true;
        updateGazePosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isTouching = false;
      touchCursor.classList.remove('active');
    });

    // Smooth Pupil Eye Gaze Animation Loop
    function renderGazeLoop() {
      // Smooth interpolation (lerp) towards finger target
      currentPupilX += (targetX - currentPupilX) * 0.25;
      currentPupilY += (targetY - currentPupilY) * 0.25;

      // Max pupil offset in pixels
      const maxOffset = 14; 
      const shiftX = currentPupilX * maxOffset;
      const shiftY = currentPupilY * maxOffset;

      pupilLeft.style.transform = `translate(${shiftX.toFixed(1)}px, ${shiftY.toFixed(1)}px)`;
      pupilRight.style.transform = `translate(${shiftX.toFixed(1)}px, ${shiftY.toFixed(1)}px)`;

      requestAnimationFrame(renderGazeLoop);
    }
    renderGazeLoop();

    // Natural Blinking Loop
    function scheduleBlink() {
      const delay = Math.random() * 3500 + 2000;
      setTimeout(() => {
        if (expressions[currentExpIndex] !== 'SLEEP' && expressions[currentExpIndex] !== 'WINK') {
          eyeLeft.classList.add('blinking');
          eyeRight.classList.add('blinking');
          setTimeout(() => {
            eyeLeft.classList.remove('blinking');
            eyeRight.classList.remove('blinking');
            scheduleBlink();
          }, 120);
        } else {
          scheduleBlink();
        }
      }, delay);
    }
    scheduleBlink();

    // ------------------------------------------------------------
    // FRONT CAMERA (IN-CAMERA) FUNCTIONALITY
    // ------------------------------------------------------------
    btnCam.addEventListener('click', async () => {
      if (isCamActive) {
        stopFrontCamera();
      } else {
        await startFrontCamera();
      }
    });

    async function startFrontCamera() {
      try {
        camStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        cameraVideo.srcObject = camStream;
        cameraVideo.style.display = 'block';

        isCamActive = true;
        btnCam.classList.add('active');
        btnCamText.textContent = 'カメラOFF';
      } catch (err) {
        alert('インカメのアクセスを許可してください');
        console.error(err);
      }
    }

    function stopFrontCamera() {
      if (camStream) {
        camStream.getTracks().forEach(track => track.stop());
      }
      cameraVideo.srcObject = null;
      cameraVideo.style.display = 'none';

      isCamActive = false;
      btnCam.classList.remove('active');
      btnCamText.textContent = 'インカメ';
    }

    // ------------------------------------------------------------
    // MICROPHONE REALTIME LIP SYNC
    // ------------------------------------------------------------
    btnMic.addEventListener('click', async () => {
      if (isMicActive) {
        stopMicrophone();
      } else {
        await startMicrophone();
      }
    });

    async function startMicrophone() {
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        isMicActive = true;
        btnMic.classList.add('active');
        btnMicText.textContent = 'マイクOFF';

        renderAudioLoop();
      } catch (err) {
        alert('マイクのアクセスを許可してください');
        console.error(err);
      }
    }

    function stopMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      isMicActive = false;
      btnMic.classList.remove('active');
      btnMicText.textContent = 'マイク';
      volFill.style.width = '0%';
      mouth.style.transform = 'scaleY(1) scaleX(1)';
    }

    function renderAudioLoop() {
      if (!isMicActive || !analyser) return;

      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) {
        sum += dataArray[i] * dataArray[i];
      }
      const rms = Math.sqrt(sum / dataArray.length);
      const rawVol = Math.min(1.0, (rms / 90) * 2.2);

      volume += (rawVol - volume) * 0.35;
      volFill.style.width = `${Math.min(100, Math.round(volume * 100))}%`;

      if (volume > 0.08) {
        const mouthScaleY = 1 + volume * 5.5;
        const mouthScaleX = 1 + volume * 0.25;
        mouth.style.transform = `scaleY(${mouthScaleY.toFixed(2)}) scaleX(${mouthScaleX.toFixed(2)})`;
      } else {
        mouth.style.transform = 'scaleY(1) scaleX(1)';
      }

      requestAnimationFrame(renderAudioLoop);
    }
  </script>
</body>
</html>
